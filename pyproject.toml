[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmafc"
version = "0.1.0"
description = "Task-and-Model-Aware Fractal-Consistency for Efficient LLM Reasoning (ICML 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Ziqiu Luo" },
    { name = "Jianmin Liu" },
    { name = "Yukai Miao" },
    { name = "Li Chen" },
    { name = "Dan Li" },
]
keywords = ["LLM", "self-consistency", "reasoning", "ICML"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
vllm = ["vllm>=0.4", "transformers>=4.40"]
classifier = ["xgboost>=1.7", "scikit-learn>=1.3"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
all = [
    "openai>=1.0",
    "vllm>=0.4",
    "transformers>=4.40",
    "xgboost>=1.7",
    "scikit-learn>=1.3",
]

[project.scripts]
tmafc-demo = "tmafc.cli:demo"
tmafc-run = "tmafc.cli:run"
tmafc-bootstrap = "tmafc.cli:bootstrap"

[project.urls]
Homepage = "https://github.com/MAX00101/TMAFC"

[tool.setuptools.packages.find]
include = ["tmafc*"]

[tool.setuptools.package-data]
tmafc = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py39"
