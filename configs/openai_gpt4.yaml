llm:
  backend: openai
  model: gpt-4

fc:
  tau: 0.95
  N_max: 50
  min_samples_for_conf: 2
  stopping_logic: ALL_CONVERGED
  anchors: true

ascc:
  K: 3
  recluster_every: 50
  bounds: [0.01, 1.0]
  history_path: data/history/openai_gpt4.jsonl

classifier:
  backend: same_as_llm
  examples_per_class: 2

record_to_history: true
